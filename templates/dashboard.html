<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DwellManager — Dashboard</title>
  <meta name="description" content="DwellManager dashboard: manage complaints, visitor logs, maintenance payments, and download reports for your apartment society." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon small">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="sidebar-brand-name">DwellManager</span>
        <span class="sidebar-brand-sub" id="sidebar-role-title">Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Injected by JS based on role -->
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-logout-text" onclick="logout()" id="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title hidden" id="topbar-title">Dashboard</div>
        <!-- Search bar like in design -->
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search..." />
        </div>
      </div>
      <div class="topbar-right">
        <span id="flat-badge" class="flat-badge hidden"></span>
        <span class="server-time" id="server-time"></span>
        <div class="topbar-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="topbar-icon" style="margin-right: 12px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="user-card topbar-user" onclick="logout()" title="Logout">
          <div class="user-info">
            <div class="user-name" id="user-name">Loading...</div>
            <div class="role-pill" id="role-pill" style="display:none">—</div>
          </div>
          <div class="user-avatar" id="user-avatar">?</div>
        </div>
      </div>
    </header>

    <div class="panel-container" id="panel-container">
      <!-- Panels injected dynamically -->
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
