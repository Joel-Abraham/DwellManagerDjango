{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DwellManager — Login</title>
  <meta name="description" content="DwellManager: Secure login portal for your apartment management system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body class="auth-body">

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="auth-container">
    <div class="glass-card auth-card">

      <div class="brand">
        <div class="brand-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-name">DwellManager</h1>
          <p class="brand-tagline">Apartment Management Portal</p>
        </div>
      </div>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      {% if messages %}
        {% for message in messages %}
        <div class="error-banner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{ message }}</span>
        </div>
        {% endfor %}
      {% endif %}

      <form method="post" class="auth-form" id="login-form">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username" class="form-label">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            {{ form.username }}
          </div>
        </div>

        <div class="form-group">
          <label for="id_password" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            {{ form.password }}
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="quick-login">
        <p class="quick-login-title">Quick Test Logins</p>
        <div class="quick-btns" style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">
          <button type="button" class="quick-btn" onclick="fillCredentials('admin','admin123')">
            <span class="role-badge admin">A</span> Admin
          </button>
          <button type="button" class="quick-btn" onclick="fillCredentials('guard1','guard123')">
            <span class="role-badge guard">G</span> Guard
          </button>
          <button type="button" class="quick-btn" onclick="fillCredentials('resident1','resident123')">
            <span class="role-badge resident">R1</span> Resident 1
          </button>
          <button type="button" class="quick-btn" onclick="fillCredentials('resident2','resident123')">
            <span class="role-badge resident">R2</span> Resident 2
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fillCredentials(user, pass) {
      document.getElementById('id_username').value = user;
      document.getElementById('id_password').value = pass;
    }
  </script>
</body>
</html>
