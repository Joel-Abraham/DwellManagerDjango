<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DwellManager — Login</title>
  <meta name="description" content="DwellManager: Secure login portal for your apartment management system. Access your resident dashboard, visitor logs, and maintenance reports." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-body">


  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="auth-container">
    <div class="glass-card auth-card">

      <div class="brand">
        <div class="brand-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-name">DwellManager</h1>
          <p class="brand-tagline">Apartment Management Portal</p>
        </div>
      </div>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div id="error-banner" class="error-banner hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text">Invalid credentials</span>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-full">
          <span class="btn-text">Sign In</span>
          <div class="btn-spinner hidden"></div>
        </button>
      </form>

      
      <div class="quick-login">
        <p class="quick-login-title">Quick Test Logins</p>
        <div class="quick-btns" style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">
          <button class="quick-btn" onclick="fillCredentials('admin','admin123')">
            <span class="role-badge admin">A</span> Admin
          </button>
          <button class="quick-btn" onclick="fillCredentials('guard1','guard123')">
            <span class="role-badge guard">G</span> Guard
          </button>
          <button class="quick-btn" onclick="fillCredentials('resident1','resident123')">
            <span class="role-badge resident">R1</span> Resident 1
          </button>
          <button class="quick-btn" onclick="fillCredentials('resident2','resident123')">
            <span class="role-badge resident">R2</span> Resident 2
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '';

    function fillCredentials(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
    }

    function togglePassword() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const spinner = btn.querySelector('.btn-spinner');
      const btnText = btn.querySelector('.btn-text');
      const errorBanner = document.getElementById('error-banner');
      const errorText = document.getElementById('error-text');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.classList.add('hidden');
      errorBanner.classList.add('hidden');

      const formData = new FormData();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);

      try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
          method: 'POST',
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || 'Login failed');
        }

        // Store token + role info
        localStorage.setItem('dwell_token', data.access_token);
        localStorage.setItem('dwell_role', data.role);
        localStorage.setItem('dwell_flat_id', data.flat_id || '');
        localStorage.setItem('dwell_name', data.full_name || '');

        window.location.href = '/dashboard';
      } catch (err) {
        errorText.textContent = err.message;
        errorBanner.classList.remove('hidden');
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.classList.remove('hidden');
      }
    });

    // Redirect if already logged in
    if (localStorage.getItem('dwell_token')) {
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
